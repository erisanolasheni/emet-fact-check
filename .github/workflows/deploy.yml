# Runs tests then deploys to ECR + App Runner. Triggered on main/master pushes and manually.
# Feature-branch pushes use backend.yml + frontend.yml only (no duplicate test runs on main).

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    name: Deploy (ECR + App Runner)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build & push images, start App Runner deployments
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          IMAGE_TAG: ${{ vars.IMAGE_TAG || 'amd64' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PREMIUM_PLAN_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PREMIUM_PLAN_KEY }}
          APP_RUNNER_BACKEND_ARN: ${{ secrets.APP_RUNNER_BACKEND_ARN }}
          APP_RUNNER_FRONTEND_ARN: ${{ secrets.APP_RUNNER_FRONTEND_ARN }}
        run: python3 scripts/deploy_app_runner.py
